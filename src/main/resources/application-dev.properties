spring.config.import=optional:file:.env.properties
# ==========================
# Profile: dev
# ==========================

# Database (valores por defecto para desarrollo local)
spring.datasource.url=jdbc:mysql://localhost:3306/pps_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:user_pps}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.co.edu.cesde.pps=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

